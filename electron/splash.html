<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Ibile POS</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #0891b2, #155e75); color: #fff;
    }
    .card { text-align: center; max-width: 440px; padding: 32px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    #status { margin: 0 0 24px; opacity: .9; min-height: 1.4em; }
    .bar { height: 6px; background: rgba(255,255,255,.2); border-radius: 3px; overflow: hidden; }
    .bar div { width: 35%; height: 100%; background: #a5f3fc; border-radius: 3px; animation: slide 1.4s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    .error .bar { display: none; }
    .error #status { color: #fecaca; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>Ibile POS</h1>
    <p id="status">Starting…</p>
    <div class="bar"><div></div></div>
  </div>
  <script>
    function setStatus(text, isError) {
      document.getElementById('status').textContent = text;
      document.getElementById('card').className = isError ? 'card error' : 'card';
    }
  </script>
</body>
</html>
