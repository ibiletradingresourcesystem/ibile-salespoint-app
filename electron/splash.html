<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Ibile POS</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at 20% 15%, rgba(165, 243, 252, .22), transparent 42%),
        radial-gradient(circle at 82% 85%, rgba(251, 146, 60, .18), transparent 46%),
        linear-gradient(135deg, #0891b2, #155e75 62%, #082f49);
      color: #fff;
      user-select: none;
    }
    .card {
      text-align: center;
      width: 100%;
      max-width: 560px;
      padding: 40px 32px;
    }

    .logo {
      width: 96px; height: 96px;
      margin: 0 auto 22px;
      display: flex; align-items: center; justify-content: center;
      /* A softly rounded panel, not a circle: the logo keeps its own shape */
      border-radius: 18px;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .22);
      box-shadow: 0 18px 40px rgba(8, 47, 73, .35);
    }
    .logo img { width: 66px; height: 66px; object-fit: contain; }

    h1 { margin: 0 0 22px; font-size: 26px; font-weight: 600; letter-spacing: 1.2px; }

    #status { margin: 0 0 18px; font-size: 15px; opacity: .92; min-height: 1.4em; }

    /* A longer, calmer progress bar: it reads as "working", not as a percentage */
    .bar {
      height: 8px;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      background: rgba(255, 255, 255, .16);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(8, 47, 73, .35);
    }
    .bar div {
      width: 42%; height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(165, 243, 252, .25), #a5f3fc 45%, #fff 70%, rgba(165, 243, 252, .25));
      animation: slide 1.6s cubic-bezier(.45, .05, .55, .95) infinite;
    }
    @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(250%); } }

    .powered {
      margin: 28px 0 0;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: .6;
    }

    .error .bar { display: none; }
    .error #status { color: #fecaca; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo"><img src="assets/bizsuits-logo.ico" alt="BizSuits Solutions System"></div>
    <h1>BizSuits Solutions System</h1>
    <p id="status">Starting…</p>
    <div class="bar"><div></div></div>
    <p class="powered">Ibile POS</p>
  </div>
  <script>
    function setStatus(text, isError) {
      document.getElementById('status').textContent = text;
      document.getElementById('card').className = isError ? 'card error' : 'card';
    }
  </script>
</body>
</html>
